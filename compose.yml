services:
  aik-base:
    build:
      context: .
      args:
        VITE_APP_MODE: ${VITE_APP_MODE:-static}
        VITE_API_URL: ${VITE_API_URL:-}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/aik-base.db
    volumes:
      - orders:/app/data
volumes:
  orders:
