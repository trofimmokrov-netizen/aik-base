name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:sites-bot
      - run: npm run cf:check
      - run: npm run test:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm run build:server
      - run: npm run test:e2e:server
      - run: npm run build
      - run: npm run test:e2e
